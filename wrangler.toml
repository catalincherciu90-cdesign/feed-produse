# Worker-ul doar servește /feed.xml și /status (plan gratuit).
# Sincronizarea rulează în GitHub Actions: .github/workflows/sync.yml
name = "feed-produse"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Id-ul NU se scrie aici: workflow-ul de deploy (.github/workflows/deploy.yml)
# îl înlocuiește din secretul GitHub CF_KV_NAMESPACE_ID.
# Pentru deploy manual de pe calculator, pune temporar id-ul în locul PUNE_AICI_ID_KV.
# Butonul „Sincronizează acum” din panou pornește acest workflow din GitHub.
[vars]
GH_REPO = "catalincherciu90-cdesign/feed-produse"
GH_WORKFLOW = "sync.yml"
GH_REF = "claude/happy-cray-ubjmi1"

# Sincronizare automată (gratuit): Cloudflare rulează Worker-ul în fiecare oră, la minutul 17;
# Worker-ul pornește sincronizarea doar dacă a trecut intervalul ales în panou (tab Status).
[triggers]
crons = ["17 * * * *"]

[[kv_namespaces]]
binding = "FEED_KV"
id = "PUNE_AICI_ID_KV"

# Secrete opționale ale Worker-ului. Workflow-ul de deploy le preia automat
# din secretele GitHub cu același nume, dacă există:
#   ADMIN_TOKEN         token pentru /status
#   CLIENT_FEED_TOKEN   token cerut clienților la /feed.xml?token=...
#   CEL_FEED_TOKEN      token cerut la /cel.xml?token=...
#   GH_DISPATCH_TOKEN   token GitHub (fine-grained, Actions: Read and write) pentru butonul de sincronizare
