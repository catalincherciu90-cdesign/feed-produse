# Worker-ul doar servește /feed.xml și /status (plan gratuit).
# Sincronizarea rulează în GitHub Actions: .github/workflows/sync.yml
name = "feed-produse"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Creează namespace-ul cu: npx wrangler kv namespace create FEED_KV
# și pune aici id-ul primit (același id merge și în secretul CF_KV_NAMESPACE_ID din GitHub).
[[kv_namespaces]]
binding = "FEED_KV"
id = "PUNE_AICI_ID_KV"

# Secrete opționale ale Worker-ului (`npx wrangler secret put NUME`):
#   ADMIN_TOKEN         token pentru /status
#   CLIENT_FEED_TOKEN   token cerut clienților la /feed.xml?token=...
