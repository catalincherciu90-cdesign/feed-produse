name: Deploy Worker

on:
  push:
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {} # buton "Run workflow" pentru deploy manual

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Doar de pe branch-ul implicit al repoului
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      CLIENT_FEED_TOKEN: ${{ secrets.CLIENT_FEED_TOKEN }}
      CEL_FEED_TOKEN: ${{ secrets.CEL_FEED_TOKEN }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verificări
        run: |
          npm run typecheck
          npm test

      - name: Verifică secretele
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_KV_NAMESPACE_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Lipsesc secretele GitHub:$missing (CF_API_TOKEN, CF_ACCOUNT_ID, CF_KV_NAMESPACE_ID)"
            exit 1
          fi

      - name: Pune id-ul KV în wrangler.toml
        run: |
          sed -i "s/PUNE_AICI_ID_KV/${CF_KV_NAMESPACE_ID}/" wrangler.toml
          grep -q "${CF_KV_NAMESPACE_ID}" wrangler.toml

      - name: Deploy
        run: npx wrangler deploy

      - name: Secretele Worker-ului (doar cele setate în GitHub)
        run: |
          for v in ADMIN_TOKEN CLIENT_FEED_TOKEN CEL_FEED_TOKEN GH_DISPATCH_TOKEN; do
            if [ -n "${!v}" ]; then
              printf '%s' "${!v}" | npx wrangler secret put "$v"
            fi
          done
