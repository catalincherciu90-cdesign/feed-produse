name: Sincronizare feed

# Sincronizare manuală: pornită din panoul de admin (butonul „Sincronizează acum”)
# sau din GitHub, cu butonul "Run workflow". Nu există rulare programată.
on:
  workflow_dispatch: {}

# Nu pornește o rulare nouă cât timp cea anterioară încă rulează.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Cât timp secretele nu sunt setate, sare peste rulare în loc să eșueze la 15 minute.
      - name: Verifică configurarea
        id: cfg
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          missing=""
          for v in SOURCE_URL CF_API_TOKEN CF_ACCOUNT_ID CF_KV_NAMESPACE_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Sincronizare sărită, lipsesc secretele GitHub:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.cfg.outputs.ready == 'true'
      - run: npx tsx src/run.ts
        if: steps.cfg.outputs.ready == 'true'
        env:
          # Secrete (Settings > Secrets and variables > Actions > Secrets)
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          CEL_USERNAME: ${{ secrets.CEL_USERNAME }}
          CEL_PASSWORD: ${{ secrets.CEL_PASSWORD }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

          # Reguli
          AVAILABLE_MIN_STOCK: "10" # feed clienți: stoc >= 10 disponibil, sub 10 indisponibil
          CEL_MIN_STOCK: "10" # CEL: sub 10 se trimite stoc 0, deci nu poate fi comandat
          CEL_BLOCK_ZERO_PRICE: "true" # preț 0 sau lipsă => stoc 0 pe CEL
          CEL_MAX_STOCK: "0" # stocul maxim trimis pe CEL; 0 = fără limită
          CEL_STOCK_BUFFER: "0" # bucăți rezervate, scăzute din stocul trimis pe CEL
          ZERO_MISSING_ON_CEL: "true" # produsele dispărute din feed primesc 0 pe CEL
          MAX_DROP_PERCENT: "50" # oprește tot dacă feed-ul scade brusc cu peste 50%
          CEL_FEED_ENABLED: "true" # feed /cel.xml pentru rubrica Feed din adminul CEL
          CEL_PUSH_ALL: "true" # trimite tot stocul la fiecare rulare: CEL = mereu feed-ul tău
          CEL_ENABLED: ${{ vars.CEL_ENABLED || 'false' }} # pornește CEL din Settings > Variables
          CEL_DEMO: ${{ vars.CEL_DEMO || 'false' }}

          # Structura feed-ului spotvisionelectric.ro
          SOURCE_ITEM_PATH: products.product
          FIELD_SKU: Product_Code
          FIELD_STOCK: Stock
          FIELD_NAME: Product_Name
          FIELD_PRICE: PRET_LISTA # preț cu TVA
          FIELD_IMAGE: Size_200_x_200 # miniatura, afișată în panou
          FIELD_GALLERY: Gallery_Images
          FIELD_GREEN_TAX: GreenTax # taxa verde cu TVA, afișată în panou
          FIELD_EAN: EAN # cod de bare, verificat în panou (lipsă / invalid / duplicat)
          CLIENT_FEED_EXTRA_FIELDS: ""
          # Feed CEL: adaugă Image_Big (imaginea mare, 879x879) lângă miniatura de 200x200
          CEL_BIG_IMAGE_FROM: Size_200_x_200
          CEL_BIG_IMAGE_FIELD: Image_Big
          # Feed CEL: PRET_LISTA conține prețul cu taxa verde inclusă (PRET_LISTA + GreenTax din sursă)
          CEL_PRICE_WITH_TAX_FIELD: PRET_LISTA
          # Feed CEL: taxa verde nu apare separat (e deja inclusă în PRET_LISTA)
          CEL_FEED_DROP_FIELDS: GreenTax
